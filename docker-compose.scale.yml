services:
  db:
    image: postgres:15
    container_name: lishchuk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - lishchuk-pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5449}:5432"
    networks:
      - lishchuk-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: lishchuk-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - lishchuk-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    environment:
      APP_OWNER: ${APP_OWNER}
      APP_SECRET: ${APP_SECRET}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL: ${CACHE_TTL}
    volumes:
      - ${PWD}/config:/app/config:ro
    ports:
      - "${APP_PORT}"
    networks:
      - lishchuk-backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8019/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  lishchuk-pgdata:

networks:
  lishchuk-backend:
        driver: bridge
