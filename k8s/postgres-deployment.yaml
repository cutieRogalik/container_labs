apiVersion: apps/v1
kind: Deployment
metadata:
  name: lishchuk-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lishchuk-postgres
  template:
    metadata:
      labels:
        app: lishchuk-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "user_19"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lishchuk-app-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "lishchuk19"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: lishchuk-postgres-pvc
